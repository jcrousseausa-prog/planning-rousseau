<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pointage Présence</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;
      padding:20px;
      overflow-x:hidden;
    }
    .container{ max-width:1400px; margin:0 auto; }
    .header{
      background:white; padding:30px; border-radius:15px;
      box-shadow:0 10px 30px rgba(0,0,0,.2); margin-bottom:20px; text-align:center;
    }
    .header h1{
      color:#667eea; font-size:32px; display:flex; align-items:center; justify-content:center;
      gap:20px; flex-wrap:wrap;
    }
    .status-bar{
      background:white; padding:12px 15px; border-radius:10px; margin-bottom:20px;
      text-align:center; box-shadow:0 4px 6px rgba(0,0,0,.1);
    }
    .status-connected{ color:#10b981; font-weight:800; }
    .status-error{ color:#ef4444; font-weight:800; }
    .panel{
      background:white; border-radius:15px; overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      padding:25px;
    }
    .form-group{ margin-bottom:16px; }
    .form-group label{
      display:block; margin-bottom:8px; font-weight:800; color:#374151;
    }
    .form-group input{
      width:100%; padding:14px; border:2px solid #e5e7eb; border-radius:8px; font-size:16px;
    }
    .input-group{ display:flex; gap:10px; }
    .btn{
      padding:14px 22px; border:none; border-radius:8px; font-size:16px; font-weight:900;
      cursor:pointer; transition: all .2s ease;
      white-space:nowrap;
    }
    .btn-primary{ background:#667eea; color:white; }
    .btn-primary:hover{ background:#5568d3; }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }
    table{
      width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden;
    }
    thead{ background:#f3f4f6; }
    th{
      padding:12px; text-align:left; font-weight:900; color:#374151;
    }
    td{
      padding:12px; border-top:1px solid #e5e7eb; vertical-align:top;
    }
    tr:hover{ background:#f9fafb; }
    .status-badge{
      padding:6px 12px; border-radius:999px; font-size:13px; font-weight:900;
    }
    .status-active{ background:#d1fae5; color:#065f46; }
    .status-ended{ background:#fee2e2; color:#991b1b; }
    .toast{
      position:fixed; top:18px; left:50%; transform:translateX(-50%);
      background:white; padding:14px 18px; border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      z-index:9999; max-width:92vw; font-weight:800;
    }
    .toast.ok{ border-left:6px solid #10b981; }
    .toast.err{ border-left:6px solid #ef4444; }
    .queue-hint{
      margin-top:8px;
      font-weight:800;
      color:#374151;
      font-size:13px;
      min-height:18px;
    }
    .presence-oops{
      color:#ff0000;
      font-weight:900;
    }
    /* =========================
       MODE USINE / BADGEUSE
       ========================= */
    .factory-screen{
      position:fixed;
      inset:0;
      z-index:20000;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .12s ease;
      padding:30px;
    }
    .factory-screen.show{
      opacity:1;
      visibility:visible;
    }
    .factory-screen.entry{
      background:#00c853; /* vert très visible */
      color:#ffffff;
    }
    .factory-screen.exit{
      background:#d50000; /* rouge sortie */
      color:#ffffff;
    }
    .factory-mode-top{
      font-size:clamp(28px, 4vw, 56px);
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.95;
      margin-bottom:25px;
      text-shadow:0 4px 20px rgba(0,0,0,.25);
    }
    .factory-mode-name{
      font-size:clamp(60px, 10vw, 180px);
      line-height:.95;
      font-weight:1000;
      letter-spacing:.01em;
      text-transform:uppercase;
      max-width:95vw;
      word-break:break-word;
      text-shadow:
        0 4px 0 rgba(0,0,0,.15),
        0 10px 30px rgba(0,0,0,.22);
    }
    .factory-mode-bottom{
      margin-top:28px;
      font-size:clamp(22px, 3.2vw, 46px);
      font-weight:900;
      opacity:.98;
      text-shadow:0 4px 20px rgba(0,0,0,.25);
    }
    .factory-pulse{
      animation:factoryPulse .45s ease 2;
    }
    @keyframes factoryPulse{
      0%{ transform:scale(1); }
      50%{ transform:scale(1.025); }
      100%{ transform:scale(1); }
    }
    @media (max-width: 900px){
      .input-group{ flex-direction:column; }
      .btn{ width:100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="status-bar">
    <span id="statusText">🔄 Vérification de la connexion…</span>
  </div>
  <div class="header">
    <h1>
      <img src="logo.png" alt="Logo" style="height:60px;width:auto;border:3px solid #2c3e50;border-radius:8px;padding:5px;background:white;">
      Pointage Présence
    </h1>
  </div>
  <div class="panel">
    <div class="form-group">
      <label>Scanner l’ID employé</label>
      <div class="input-group">
        <input
          type="text"
          id="scanInput"
          placeholder="Scannez l’ID (ex: 111)..."
          autocomplete="off"
          inputmode="none"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); handlePresenceScan(); }"
        >
        <button id="presenceBtn" class="btn btn-primary" onclick="handlePresenceScan()">Pointer</button>
      </div>
      <div id="queueHint" class="queue-hint"></div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Employé</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Temps</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="presenceTableBody">
          <tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
  <!-- ÉCRAN CHOIX TÂCHE/CHANTIER -->
<div id="taskScreen" class="factory-screen entry" aria-hidden="true">
  <div class="factory-mode-top" id="taskTop">Sélectionnez votre tâche</div>
  <div id="taskButtons" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px;max-width:90vw"></div>
</div>
<!-- ÉCRAN PLEIN MODE USINE -->
<div id="factoryScreen" class="factory-screen" aria-hidden="true">
  <div id="factoryTop" class="factory-mode-top">POINTAGE ENREGISTRÉ</div>
  <div id="factoryName" class="factory-mode-name">NOM EMPLOYÉ</div>
  <div id="factoryBottom" class="factory-mode-bottom">ENTRÉE</div>
</div>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzTvmU8uvjwEpdV8Q1bB9zo_XUJH0-e3K0cX_Snt7sCnGbEbbojASPmkUa8d2gswrI/exec";
  let EMP_BY_ID = new Map();
  let presenceRecords = [];
  let processing = false;
  let queue = [];
  let syncTimer = null;
  let lastLocalChangeAt = 0;
  const STORAGE_KEY = 'pointage-presence-id-v7';
  const SCAN_LOCK_MS = 2000;
  const employeeCooldown = new Map();
  let factoryTimer = null;
    const ERP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzIgJe_jVVYrwNYEgJo3NKOgL7DHZqLvAD_VO56axypAj1AOao6JcbRxIaVhwF/exec";
  let CHANTIERS = [];
  let OPERATIONS = ['Assemblage','Isolation','Agrafage','Finition','Bardage','Chargement','Reprise','Usinage','Logistique'];
  let chantiersDisponibles = false;

    window.onload = function() {
    testConnection();
    chargerChantiersERP();
    loadEmployees().finally(async () => {
      loadLocalSafe_();
      await loadPresenceFromServer(true);
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(() => loadPresenceFromServer(false), 30000);
      lockFocus();
      updateQueueInfo();
        async function chargerChantiersERP(){
    try {
      const res = await http_(ERP_SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({action:'getListeChantiersOperations'})
      });
      const txt = await res.text();
      const r = JSON.parse(txt);
      if (r.ok && r.chantiers && r.chantiers.length) {
        CHANTIERS = r.chantiers;
        if (r.operations && r.operations.length) OPERATIONS = r.operations;
        chantiersDisponibles = true;
      }
    } catch(e) {
      console.warn('Chantiers ERP indisponibles, pointage simple maintenu:', e);
      chantiersDisponibles = false;
    }
  }
    });
  };

  /***********************
   * Compat / réseau
   ***********************/
  function safeNormalize_(s){
    s = String(s || '').trim().toLowerCase();
    try { if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e) {}
    return s;
  }
  function http_(url, opts){
    opts = opts || {};
    if (window.fetch) return fetch(url, opts);
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open(opts.method || 'GET', url, true);
      if (opts.headers) Object.keys(opts.headers).forEach(k => xhr.setRequestHeader(k, opts.headers[k]));
      xhr.timeout = 15000;
      xhr.onload = () => resolve({
        ok: xhr.status >= 200 && xhr.status < 300,
        status: xhr.status,
        text: () => Promise.resolve(xhr.responseText)
      });
      xhr.ontimeout = () => reject(new Error('timeout'));
      xhr.onerror = () => reject(new Error('network'));
      xhr.send(opts.body || null);
    });
  }

  /***********************
   * Focus lock
   ***********************/
  function lockFocus(){
    const input = document.getElementById('scanInput');
    input.focus();
    document.addEventListener('mousedown', (e) => {
      if (e.target !== input) setTimeout(() => input.focus(), 0);
    }, true);
    input.addEventListener('blur', () => setTimeout(() => input.focus(), 0));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' || e.key === 'Escape') {
        e.preventDefault();
        input.focus();
      }
    }, true);
  }

  /***********************
   * UI helpers
   ***********************/
  function toast(msg, ok=true, duration=2000){
    const d = document.createElement('div');
    d.className = 'toast ' + (ok ? 'ok':'err');
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(()=>{ d.remove(); }, duration);
  }
  function setStatus(msg, ok){
    const el = document.getElementById('statusText');
    el.textContent = msg;
    el.className = ok ? 'status-connected' : 'status-error';
  }
  function updateQueueInfo(){
    const waiting = queue.length;
    document.getElementById('queueHint').textContent =
      waiting > 0 ? `Scans en attente : ${waiting}` : '';
  }
  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, (m) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  /***********************
   * Affichage badgeuse
   ***********************/
    function demanderOperation(nom){
    return new Promise(resolve=>{
      const screen = document.getElementById('taskScreen');
      document.getElementById('taskTop').textContent = nom.toUpperCase() + ' — Choisissez votre tâche';
      document.getElementById('taskButtons').innerHTML = OPERATIONS.map(op =>
        `<button class="btn btn-primary" style="padding:26px 10px;font-size:19px" data-op="${escapeHtml(op)}">${escapeHtml(op)}</button>`
      ).join('');
      screen.classList.add('show');
      const handler = (e)=>{
        const btn = e.target.closest('[data-op]');
        if (!btn) return;
        screen.removeEventListener('click', handler);
        screen.classList.remove('show');
        resolve(btn.getAttribute('data-op'));
      };
      screen.addEventListener('click', handler);
    });
  }

  function demanderChantier(nom, operation){
    return new Promise(resolve=>{
      const screen = document.getElementById('taskScreen');
      document.getElementById('taskTop').textContent = nom.toUpperCase() + ' — ' + operation + ' — Choisissez le chantier';
      document.getElementById('taskButtons').innerHTML = CHANTIERS.map(ch =>
        `<button class="btn btn-primary" style="padding:22px 8px;font-size:15px" data-ch="${escapeHtml(ch)}">${escapeHtml(ch)}</button>`
      ).join('');
      screen.classList.add('show');
      const handler = (e)=>{
        const btn = e.target.closest('[data-ch]');
        if (!btn) return;
        screen.removeEventListener('click', handler);
        screen.classList.remove('show');
        resolve(btn.getAttribute('data-ch'));
      };
      screen.addEventListener('click', handler);
    });
  }
  function showFactoryScreen(employeeName, mode){
    const screen = document.getElementById('factoryScreen');
    const top = document.getElementById('factoryTop');
    const name = document.getElementById('factoryName');
    const bottom = document.getElementById('factoryBottom');
    if (factoryTimer) {
      clearTimeout(factoryTimer);
      factoryTimer = null;
    }
    screen.classList.remove('entry', 'exit', 'show', 'factory-pulse');
    const isExit = mode === 'exit';
    screen.classList.add(isExit ? 'exit' : 'entry');
    screen.classList.add('show');
    screen.classList.add('factory-pulse');
    top.textContent = 'POINTAGE ENREGISTRÉ';
    name.textContent = String(employeeName || '').toUpperCase();
    bottom.textContent = isExit ? 'SORTIE' : 'ENTRÉE';
    screen.setAttribute('aria-hidden', 'false');
    factoryTimer = setTimeout(() => {
      screen.classList.remove('show', 'factory-pulse');
      screen.setAttribute('aria-hidden', 'true');
    }, 1500);
  }

  /***********************
   * Date formatting
   ***********************/
  function formatDisplayFR_(value){
    if (value == null || value === '') return '-';
    if (/^\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}(:\d{2})?$/.test(String(value))) {
      return String(value).replace(/:\d{2}$/, '');
    }
    const iso = String(value);
    if (/^\d{4}-\d{2}-\d{2}T/.test(iso)) {
      const d = new Date(iso);
      if (!isNaN(d)) {
        return d.toLocaleString('fr-FR', {
          day:'2-digit', month:'2-digit', year:'numeric',
          hour:'2-digit', minute:'2-digit'
        });
      }
    }
    const d2 = new Date(String(value));
    if (!isNaN(d2)) {
      return d2.toLocaleString('fr-FR', {
        day:'2-digit', month:'2-digit', year:'numeric',
        hour:'2-digit', minute:'2-digit'
      });
    }
    return String(value);
  }

  /***********************
   * API
   ***********************/
  function testConnection(){
    setStatus('🔄 Connexion en cours…', false);
    http_(SCRIPT_URL, { method:'GET', cache:'no-store' })
      .then(r => r.text().then(t => {
        if (r.ok && String(t).includes('OK')) setStatus('✅ Connecté à Google Sheets', true);
        else setStatus(`⚠️ Connexion incertaine (HTTP ${r.status})`, false);
      }))
      .catch((e)=>{
        console.error(e);
        setStatus('❌ Erreur de connexion', false);
      });
  }
  function get(action){
    const url = SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&_ts=' + Date.now();
    return http_(url, { method:'GET', cache:'no-store' })
      .then(r => r.text().then(t => {
        if (!r.ok) throw new Error(`HTTP ${r.status} ${action} | ${String(t).slice(0,120)}`);
        try { return JSON.parse(t); }
        catch(e){ throw new Error(`Non-JSON ${action} | ${String(t).slice(0,120)}`); }
      }));
  }
  function post(action, payload){
    const body = JSON.stringify(Object.assign({action}, payload || {}));
    return http_(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      cache:'no-store'
    }).then(r => r.text().then(t => {
      if (!r.ok) throw new Error(`HTTP ${r.status} POST ${action} | ${String(t).slice(0,120)}`);
      try { return JSON.parse(t); }
      catch(e){ throw new Error(`POST non-JSON ${action} | ${String(t).slice(0,120)}`); }
    }));
  }

  async function loadEmployees(){
    try {
      const rows = await get('getEmployees');
      EMP_BY_ID = new Map();
      (rows || []).forEach(r => {
        const id = String(r[0] ?? '').trim();
        const nom = String(r[1] ?? '').trim();
        if (id && nom) EMP_BY_ID.set(id, nom);
      });
      toast(`✅ Employés chargés (${EMP_BY_ID.size})`, true, 2000);
    } catch (e) {
      console.error(e);
      EMP_BY_ID = new Map();
      toast('❌ Erreur chargement employés: ' + String(e.message || e).slice(0,120), false, 2000);
    }
  }

  /***********************
   * Local storage
   ***********************/
  function loadLocalSafe_(){
    try {
      const p = localStorage.getItem(STORAGE_KEY);
      if (!p) { presenceRecords = []; return; }
      const obj = JSON.parse(p);
      const recs = Array.isArray(obj.records) ? obj.records : [];
      presenceRecords = recs.filter(r => r && r.employeeId);
    } catch(e){
      presenceRecords = [];
    }
    renderPresence();
  }
  function saveLocal(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ records: presenceRecords }));
  }

  /***********************
   * Durée
   ***********************/
  function parseFRDateTime_(s){
    const m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/);
    if (!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]), Number(m[6] || 0));
  }
  function calcDurationFromFR_(startFR, endDate){
    const d0 = parseFRDateTime_(startFR);
    if (!d0) return '';
    const diff = endDate - d0;
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    return h + 'h ' + m + 'min';
  }
  function isActiveRecordStrict_(r){
    const finTxt = String(r.fin ?? '').trim();
    const finEmpty = (finTxt === '' || finTxt === '-');
    const st = safeNormalize_(r.statut || '');
    return finEmpty && st === 'en cours';
  }
  function parseDurationToMinutes_(txt){
    if (!txt) return null;
    const s = String(txt).trim().toLowerCase();
    const m = s.match(/^(\d+)\s*h(?:\s*(\d+)\s*min)?$/);
    if (!m) return null;
    const h = Number(m[1] || 0);
    const min = Number(m[2] || 0);
    return (h * 60) + min;
  }
  function shouldHighlightOvertime_(record){
    const active = isActiveRecordStrict_(record);
    if (active) return false;
    const mins = parseDurationToMinutes_(record.temps);
    if (mins == null) return false;
    return mins > 330;
  }

  /***********************
   * Sync depuis Sheets
   ***********************/
  async function loadPresenceFromServer(showToast=false){
    if (!showToast && (Date.now() - lastLocalChangeAt) < 2000) return;
    try {
      const rows = await get('getPresence');
      const list = (rows || []).map(r => ({
        id: String(r[0] ?? ''),
        employeeId: String(r[1] ?? '').trim(),
        nom: String(r[2] ?? '').trim(),
        debut: String(r[3] ?? ''),
        fin: (r[4] == null || r[4] === '') ? null : String(r[4]),
        temps: (r[5] == null || r[5] === '') ? null : String(r[5]),
        statut: String(r[6] ?? '')
      })).filter(x => x.employeeId);
      for (const it of list){
        if (!it.nom) it.nom = EMP_BY_ID.get(it.employeeId) || '';
      }
      list.sort((a,b)=>{
        function toDate(x){
          if(!x) return new Date(0);
          const m = x.match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/);
          if(m) return new Date(m[3],m[2]-1,m[1],m[4],m[5]);
          const d = new Date(x);
          return isNaN(d)? new Date(0): d;
        }
        const da = toDate(a.fin || a.debut);
        const db = toDate(b.fin || b.debut);
        return db - da;
      });
      presenceRecords = list;
      renderPresence();
      saveLocal();
      if (showToast) toast('🔄 Synchronisé avec Google Sheets', true, 2000);
    } catch (e) {
      console.error(e);
      toast("⚠️ Sync impossible: " + String(e.message || e).slice(0,140), false, 2000);
    }
  }

  /***********************
   * Anti double scan
   ***********************/
  function isEmployeeLocked_(employeeId){
    const expireAt = employeeCooldown.get(employeeId) || 0;
    if (expireAt <= Date.now()) {
      employeeCooldown.delete(employeeId);
      return false;
    }
    return true;
  }
  function lockEmployee_(employeeId, ms){
    employeeCooldown.set(employeeId, Date.now() + ms);
  }
  function unlockEmployee_(employeeId){
    employeeCooldown.delete(employeeId);
  }
  function makeRequestId_(employeeId){
    return [
      'REQ',
      employeeId,
      Date.now(),
      Math.random().toString(36).slice(2, 10)
    ].join('_');
  }

  /***********************
   * API start/end
   ***********************/
  function startPresence_(payload){
    return post('startPresence', payload);
  }
  function endPresence_(payload){
    return post('endPresence', payload);
  }

  /***********************
   * Scan
   ***********************/
  async function handlePresenceScan(){
    const input = document.getElementById('scanInput');
    const raw = String(input.value || '');
    input.value = '';
    input.focus();
    const cleaned = raw
      .replace(/[\u0000-\u001F\u007F\u00A0]/g, ' ')
      .replace(/\u001d/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    const candidates = cleaned.match(/\b\d{1,6}\b/g);
    let employeeId = candidates ? candidates[candidates.length - 1] : '';
    if (employeeId === '0') employeeId = '';
    if (!employeeId) {
      toast("❌ Scan illisible. Contenu: " + cleaned, false, 2000);
      return;
    }
    const nom = EMP_BY_ID.get(employeeId);
    if (!nom){
      toast("❌ ID inconnu. Scanne un ID existant (ex: 111).", false, 2000);
      return;
    }
    if (isEmployeeLocked_(employeeId)) {
      toast(`⏳ Pointage déjà pris en compte pour ${nom}`, true, 2000);
      return;
    }
    lockEmployee_(employeeId, SCAN_LOCK_MS);
    toast(`✅ Pointage pris en compte : ${nom}`, true, 2000);
    queue.push(employeeId);
    updateQueueInfo();
    if (processing){
      if (queue.length >= 8) toast('⏳ Beaucoup de scans en attente…', true, 2000);
      return;
    }
    processing = true;
    try {
      while (queue.length > 0){
        const eid = queue.shift();
        updateQueueInfo();
        const empName = EMP_BY_ID.get(eid) || eid;
        const lastForEmployee = presenceRecords.find(r => r.employeeId === eid) || null;
        const now = new Date();
        const nowTxt = now.toLocaleString('fr-FR', {
          day:'2-digit', month:'2-digit', year:'numeric',
          hour:'2-digit', minute:'2-digit', second:'2-digit'
        });
        const requestId = makeRequestId_(eid);
        const shouldEnd = lastForEmployee && isActiveRecordStrict_(lastForEmployee);
        if (shouldEnd){
          const temps = calcDurationFromFR_(lastForEmployee.debut, now) || '';
          presenceRecords = presenceRecords.map(r => {
            if (r.id === lastForEmployee.id){
              return { ...r, fin: nowTxt, temps, statut:'Terminé' };
            }
            return r;
          });
          lastLocalChangeAt = Date.now();
          renderPresence();
          saveLocal();
          showFactoryScreen(empName, 'exit');
          try {
            const res = await endPresence_({
              requestId: requestId,
              employeeId: eid,
              recordId: lastForEmployee.id,
              fin: nowTxt,
              temps: temps
            });
            if (res && res.success) {
              toast(`Présence terminée : ${empName}`, true, 2000);
            } else {
              toast('❌ Erreur serveur (fin)', false, 2000);
              console.error(res);
              unlockEmployee_(eid);
            }
          } catch (err) {
            console.error(err);
            toast('❌ Erreur réseau (fin): ' + String(err.message || err).slice(0,90), false, 2000);
            unlockEmployee_(eid);
          } finally {
            loadPresenceFromServer(false);
          }
           } else {
          let operationChoisie = '', chantierChoisi = '';
          if (chantiersDisponibles) {
            operationChoisie = await demanderOperation(empName);
            if (operationChoisie && operationChoisie !== 'Logistique' && operationChoisie !== 'Usinage') {
              chantierChoisi = await demanderChantier(empName, operationChoisie);
            }
          }
          const rec = {
            id: String(Date.now()),
            employeeId: eid,
            nom: empName,
            debut: nowTxt,
            fin: null,
            temps: null,
            statut: 'En cours'
          };
          presenceRecords = [rec].concat(presenceRecords);
          lastLocalChangeAt = Date.now();
          renderPresence();
          saveLocal();
          showFactoryScreen(empName, 'entry');
          try {
            const res = await startPresence_({
              requestId: requestId,
              employeeId: eid,
              recordId: rec.id,
              nom: empName,
              debut: rec.debut,
              operation: operationChoisie,
              of: chantierChoisi
            });
            if (res && res.success) {
              toast(`Présence démarrée : ${empName}`, true, 2000);
            } else {
              toast('❌ Erreur serveur (début)', false, 2000);
              console.error(res);
              unlockEmployee_(eid);
            }
          } catch (err) {
            console.error(err);
            toast('❌ Erreur réseau (début): ' + String(err.message || err).slice(0,90), false, 2000);
            unlockEmployee_(eid);
          } finally {
            loadPresenceFromServer(false);
          }
        }
        input.focus();
      }
    } finally {
      processing = false;
      updateQueueInfo();
      input.focus();
    }
  }

  /***********************
   * Render
   ***********************/
  function renderPresence(){
    const tbody = document.getElementById('presenceTableBody');
    if (!presenceRecords.length){
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Aucun pointage</td></tr>';
      return;
    }
    tbody.innerHTML = presenceRecords.map(r=>{
      const active = isActiveRecordStrict_(r);
      const nom = r.nom || (EMP_BY_ID.get(r.employeeId) || '');
      const highlight = shouldHighlightOvertime_(r);
      return `<tr>
        <td>${escapeHtml(nom)}</td>
        <td>${escapeHtml(formatDisplayFR_(r.debut))}</td>
        <td>${escapeHtml(formatDisplayFR_(r.fin))}</td>
        <td class="${highlight ? 'presence-oops' : ''}">${escapeHtml(r.temps || '-')}</td>
        <td><span class="status-badge ${active?'status-active':'status-ended'}">${active?'En cours':'Terminé'}</span></td>
      </tr>`;
    }).join('');
  }
</script>
</body>
</html>
