<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pointage Atelier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Arial,sans-serif}
body{background:#1a2634;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:100%;max-width:700px;padding:24px;text-align:center}
.clock{font-size:52px;font-weight:700;font-family:'DM Mono',monospace;margin-bottom:6px}
.date{font-size:16px;color:#8fa3b8;margin-bottom:40px;text-transform:capitalize}
.instr{font-size:24px;font-weight:600;margin-bottom:24px}
.hidden-input{position:absolute;opacity:0;pointer-events:none}
.badge-icon{font-size:80px;margin-bottom:20px}
.grid-btn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.opt-btn{background:#26374a;border:2px solid #37506b;color:#fff;border-radius:14px;padding:22px 10px;font-size:17px;font-weight:600;cursor:pointer;transition:.15s}
.opt-btn:active{background:#3a7ca8;transform:scale(.97)}
.confirm{background:#1e5c3a;border-radius:20px;padding:40px;animation:pop .3s}
.confirm.out{background:#5c2e1e}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.confirm h2{font-size:32px;margin-bottom:8px}
.confirm .heure{font-size:48px;font-weight:700;font-family:'DM Mono',monospace;margin:12px 0}
.error{background:#5c1e1e;border-radius:20px;padding:30px;font-size:20px}
.back-btn{margin-top:24px;background:none;border:1px solid #37506b;color:#8fa3b8;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="dateAff"></div>
  <div id="content"></div>
</div>
<input type="text" id="scanInput" class="hidden-input" autofocus/>

<script>
   const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzIgJe_jVVYrwNYEgJo3NKOgL7DHZqLvAD_VO56axypAj1AOao6JcbRxIaVhwF/exec";

let state = { step:'attente', matricule:null, nom:null, prenom:null, operation:null, chantiers:[], operations:[] };

function refocus(){ document.getElementById('scanInput').focus(); }
setInterval(refocus, 500);
document.addEventListener('click', refocus);

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
  document.getElementById('dateAff').textContent = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tickClock,1000); tickClock();

async function chargerListes(){
  try{
    const res = await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getListeChantiersOperations'})});
    const r = await res.json();
    if(r.ok){ state.chantiers = r.chantiers; state.operations = r.operations; }
  }catch(e){ console.warn(e); }
}
chargerListes();

function render(){
  const c = document.getElementById('content');
  if(state.step==='attente'){
    c.innerHTML = `<div class="badge-icon">🪪</div><div class="instr">Scannez votre badge</div>`;
  } else if(state.step==='choix_operation'){
    c.innerHTML = `<div class="instr">${state.prenom} ${state.nom}<br><span style="font-size:16px;color:#8fa3b8">Sélectionnez la tâche</span></div>
      <div class="grid-btn">${state.operations.map(o=>`<button class="opt-btn" onclick="choisirOperation('${o}')">${o}</button>`).join('')}</div>
      <button class="back-btn" onclick="reset()">Annuler</button>`;
  } else if(state.step==='choix_chantier'){
    c.innerHTML = `<div class="instr">${state.prenom} ${state.nom} — ${state.operation}<br><span style="font-size:16px;color:#8fa3b8">Sélectionnez le chantier</span></div>
      <div class="grid-btn">${state.chantiers.map(ch=>`<button class="opt-btn" style="font-size:14px" onclick="choisirChantier('${ch.replace(/'/g,"\\'")}')">${ch}</button>`).join('')}</div>
      <button class="back-btn" onclick="reset()">Annuler</button>`;
  } else if(state.step==='confirmation'){
    const isOut = state.dernierResultat.type==='OUT';
    c.innerHTML = `<div class="confirm ${isOut?'out':''}">
      <h2>${isOut?'👋 Sortie enregistrée':'✅ Entrée enregistrée'}</h2>
      <div>${state.nom} ${state.prenom}</div>
      <div class="heure">${state.dernierResultat.heure}</div>
      ${state.chantierAff?`<div style="font-size:15px;color:#cfe0ec">${state.operationAff||''} — ${state.chantierAff}</div>`:''}
    </div>`;
    setTimeout(reset, 3000);
  } else if(state.step==='erreur'){
    c.innerHTML = `<div class="error">❌ ${state.erreurMsg}</div>`;
    setTimeout(reset, 2500);
  }
}

function reset(){
  state = { step:'attente', matricule:null, nom:null, prenom:null, operation:null, chantiers:state.chantiers, operations:state.operations };
  render();
  document.getElementById('scanInput').value='';
  refocus();
}

async function envoyerPointage(){
  try{
    const res = await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({
      action:'enregistrerPointage',
      matricule: state.matricule,
      chantier: state.chantierAff||'',
      operation: state.operationAff||''
    })});
    const r = await res.json();
    if(!r.ok){ state.step='erreur'; state.erreurMsg=r.error||'Erreur inconnue'; render(); return; }
    state.dernierResultat = r;
    state.step='confirmation';
    render();
  }catch(e){
    state.step='erreur'; state.erreurMsg='Erreur réseau'; render();
  }
}

function choisirOperation(op){
  state.operation = op;
  state.operationAff = op;
  if(op==='Logistique' || op==='Usinage'){
    envoyerPointage();
  } else {
    state.step='choix_chantier';
    render();
  }
}

function choisirChantier(ch){
  state.chantierAff = ch;
  envoyerPointage();
}

document.getElementById('scanInput').addEventListener('keydown', async (e)=>{
  if(e.key !== 'Enter') return;
  const val = e.target.value.trim();
  e.target.value = '';
  if(!val) return;

  if(state.step==='attente'){
    // Scan de l'ID employé
    try{
      const res = await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getEmployeParMatricule', matricule: val})});
      // Note: si getEmployeParMatricule n'est pas exposée en action directe, voir remarque ci-dessous
    }catch(e){}
    // Pour simplifier le flux ici, on tente directement le pointage "vide" pour vérifier le matricule,
    // puis on affiche le choix d'opération avant l'enregistrement réel
    state.matricule = val;
    state.step = 'verif_matricule';
    render();
    verifierMatricule(val);
  }
});

async function verifierMatricule(matricule){
  try{
    const res = await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'verifierMatricule', matricule})});
    const r = await res.json();
    if(!r.ok){ state.step='erreur'; state.erreurMsg=r.error||'Badge inconnu'; render(); return; }
    state.nom = r.nom; state.prenom = r.prenom;
    state.step = 'choix_operation';
    render();
  }catch(e){
    state.step='erreur'; state.erreurMsg='Erreur réseau'; render();
  }
}

render();
refocus();
</script>
</body>
</html>
